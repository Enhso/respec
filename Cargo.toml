[package]
name = "respec"
version = "0.2.0"
edition = "2024"
description = "Local-first OSINT graph: articles in, a sourced Knowledge graph out"
publish = false

[dependencies]
anyhow = "1"
axum = "0.8"
dirs = "7"
# Pre-1.0 mnestic releases break the storage format with no migration, so the
# pin stays exact. The library name is `cozo`.
mnestic = "=0.18.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "time"] }
tower-http = { version = "0.6", features = ["fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["sync"] }
tower = { version = "0.5", features = ["util"] }
