[package]
name = "respec"
version = "0.1.0"
edition = "2024"
description = "Local-first OSINT graph: articles in, a sourced Knowledge graph out"
publish = false

[dependencies]
anyhow = "1"
axum = "0.8"
# Pre-1.0 mnestic releases break the storage format with no migration, so the
# pin stays exact. The library name is `cozo`.
mnestic = "=0.18.0"
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["io-util"] }
