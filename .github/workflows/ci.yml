name: CI

on:
  push:
  workflow_dispatch:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked

  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv sync --frozen
      - run: uv run --frozen ruff check
      - run: uv run --frozen ruff format --check
      - run: uv run --frozen mypy
      - run: uv run --frozen pytest

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build

  # ISC-4: no test reads or writes outside a temporary directory.
  isolation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv sync --frozen --directory python
      - run: scripts/test-isolation.sh

  # Tag-gated: a v* tag push is the full run above, then this builds the macOS
  # arm64 bundle, smoke-tests it, proves install.sh against it on a fresh home
  # and publishes it. A manual run (workflow_dispatch) does everything except
  # the tag check and the publish, so the install can be proven without
  # cutting a tag. It lives in this workflow so the latest run (the ISC-1 and
  # 2 probe) is always full CI.
  release:
    needs: [rust, python, web, isolation]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - name: Require an Apple Silicon runner
        run: |
          arch="$(uname -m)"
          if [ "$arch" != arm64 ]; then
            echo "Runner is $arch, not arm64; the bundle targets aarch64-apple-darwin." >&2
            exit 1
          fi
      - uses: actions/checkout@v7
      - name: Require the tag to match the Cargo version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="$(awk -F'"' '/^version = /{print $2; exit}' Cargo.toml)"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match the Cargo version $version; expected v$version." >&2
            exit 1
          fi
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v10.2.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build the bundle
        id: bundle
        run: |
          set -o pipefail
          scripts/bundle.sh aarch64-apple-darwin | tee "$RUNNER_TEMP/bundle.log"
          echo "tarball=$(tail -n 1 "$RUNNER_TEMP/bundle.log")" >> "$GITHUB_OUTPUT"
      - name: Smoke-test the unpacked bundle
        env:
          TARBALL: ${{ steps.bundle.outputs.tarball }}
        run: scripts/smoke-bundle.sh "$TARBALL"
      - name: Prove install.sh on a fresh home directory
        env:
          TARBALL: ${{ steps.bundle.outputs.tarball }}
        run: scripts/install-check.sh "$TARBALL"
      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TARBALL: ${{ steps.bundle.outputs.tarball }}
        run: gh release create "$GITHUB_REF_NAME" "$TARBALL" --title "Respec $GITHUB_REF_NAME" --generate-notes
