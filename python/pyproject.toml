[project]
name = "respec-worker"
version = "0.1.0"
description = "Respec extraction worker: fetches articles, calls models, reports progress as JSON Lines"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "httpx>=0.28.1",
    "lxml>=6.1.3",
    "orjson>=3.12.0",
    "pydantic>=2.13.5",
    "trafilatura>=2.3.0",
]

[project.scripts]
respec-worker = "respec_worker.cli:main"

[dependency-groups]
dev = ["mypy>=1.15", "pytest>=8.3", "ruff>=0.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/respec_worker"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
